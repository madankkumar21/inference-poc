[project]
name = "inference-poc"
version = "0.1.0"
description = "A 48-hour inference POC as a customer would receive it: one model, one traffic shape, any OpenAI-compatible endpoint, measured for TTFT, throughput, cold start and cost per million tokens."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "modal==1.6.4",   # the decorators used in providers/modal_app.py are checked against this release
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
